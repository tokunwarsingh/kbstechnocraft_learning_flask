{% extends "base.html" %}

{% block title %}Edit Todo{% endblock %}

{% block content %}
<section class="panel">
    <p class="eyebrow">Update task</p>
    <h1>Edit todo</h1>
    <form method="post" action="{{ url_for('web.update_todo', todo_id=todo.id) }}">
        <label for="title">Title</label>
        <input id="title" name="title" value="{{ todo.title }}" maxlength="200" required>
        <div class="actions">
            <button type="submit">Save changes</button>
            <a class="link-button" href="{{ url_for('web.index') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
